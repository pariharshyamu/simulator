<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d"><title id="t">Measured against model-expected bearing temperature</title><desc id="d">The measured line climbs from 74 to 91 °C over twelve weeks while the model expectation stays flat at 74 °C. The residual reaches +4 °C in week 5, when the measured value is still 12 °C below the 90 °C DCS alarm.</desc><rect width="940" height="470" fill="#FFFFFF"/><text x="36.0" y="30.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1C2530" text-anchor="start" font-weight="600" >ID fan drive-end bearing temperature, °C</text><text x="36.0" y="54.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#6B7A8C" text-anchor="start" font-weight="400" >Indicative reconstruction of a 210 MW ID fan — the numbers in section 2.2</text><line x1="78" y1="300.3" x2="672" y2="300.3" stroke="#E6EBF0" stroke-width="1"/><text x="68.0" y="304.3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7A8C" text-anchor="end" font-weight="400" >74</text><line x1="78" y1="258.7" x2="672" y2="258.7" stroke="#E6EBF0" stroke-width="1"/><text x="68.0" y="262.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7A8C" text-anchor="end" font-weight="400" >78</text><line x1="78" y1="217.0" x2="672" y2="217.0" stroke="#E6EBF0" stroke-width="1"/><text x="68.0" y="221.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7A8C" text-anchor="end" font-weight="400" >82</text><line x1="78" y1="175.3" x2="672" y2="175.3" stroke="#E6EBF0" stroke-width="1"/><text x="68.0" y="179.3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7A8C" text-anchor="end" font-weight="400" >86</text><line x1="78" y1="133.7" x2="672" y2="133.7" stroke="#E6EBF0" stroke-width="1"/><text x="68.0" y="137.7" font-family="Segoe UI, Helvetica Neu