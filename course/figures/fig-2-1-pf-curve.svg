<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" role="img" aria-labelledby="t d"><title id="t">The P–F interval</title><desc id="d">A condition curve falling from P, potential failure, to F, functional failure. Six detection techniques are marked along it, earliest first: AI multivariate anomaly detection, online condition monitoring, periodic vibration route, operator round, fixed DCS alarm, and finally the protection trip at F.</desc><rect width="940" height="540" fill="#FFFFFF"/><text x="74.0" y="32.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1C2530" text-anchor="start" font-weight="600" >The P–F interval, and where each technique detects</text><text x="74.0" y="52.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#6B7A8C" text-anchor="start" font-weight="400" >You do not choose the P–F interval — physics does. You only choose how much of it you use.</text><polyline points="104.0,390.0 113.5,390.0 122.9,390.0 132.3,389.9 141.8,389.9 151.2,389.8 160.7,389.7 170.1,389.5 179.6,389.3 189.1,389.1 198.5,388.8 207.9,388.5 217.4,388.1 226.9,387.7 236.3,387.2 245.8,386.7 255.2,386.0 264.6,385.4 274.1,384.6 283.5,383.8 293.0,382.9 302.5,382.0 311.9,380.9 321.4,379.8 330.8,378.6 340.2,377.4 349.7,376.0 359.1,374.6 368.6,373.0 378.1,371.4 387.5,369.7 396.9,367.9 406.4,366.0 415.8,364.0 425.3,361.9 434.8,359.7 444.2,357.4 453.7,355.0 463.1,352.5 472.6,349.8 482.0,347.1 491.4,344.3 500.9,341.3 510.3,338.2 519.8,335.1 529.2,331.8 538.7,328.3 548.2,324.8 557.6,321.1 567.0,317.3 576.5,313.4 586.0,309.3 595.4,305.2 604.8,300.9 614.3,296.4 623.8,291.9 633.2,287.1 642.6,282.3 652.1,277.3 661.6,272.2 671.0,266.9 680.4,261.5 689.9,256.0 699.4,250.3 708.8,244.5 718.2,238.5 727.7,232.3 737.1,226.0 746.6,219.6 756.1,213.0 765.5,206.3 774.9,199.4 784.4,192.3 793.9,185.1 803.3,177.7 812.8,170.2 822.2,162.5 831.6,154.6 841.1,146.6 850.6,138.4 860.0,130.0" fill="none" stroke="#1C2530" stroke-width="2.5" stroke-linecap="round"/><line x1="88" y1="390" x2="886" y2="390" stroke="#D5DDE5" stroke-width="1.5"/><text x="88.0" y="412.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#6B7A8C" text-anchor="start" font-weight="400" >time  →</text><text x="74.0" y="138.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#6B7A8C" text-anchor="start" font-weight="400" >condition</text><line x1="104.0" y1="120" x2="104.0" y2="398" stroke="#6B7A8C" stroke-width="1.5" stroke-dasharray="4 4"/><text x="104.0" y="434.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#6B7A8C" text-anchor="middle" font-weight="700" >P</text><text x="104.0" y="454.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7A8C" text-anchor="middle" font-weight="400" >potential failure —</text><text x="104.0" y="467.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7A8C" text-anchor="middle" font-weight="400" >nothing measurable</text><text x="104.0" y="480.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7A8C" text-anchor="middle" font-weight="400" >has changed yet</text><line x1="860.0" y1="120" x2="860.0" y2="398" stroke="#A8261E" stroke-width="1.5" stroke-dasharray="4 4"/><text x="860.0" y="434.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#A8261E" text-anchor="middle" font-weight="700" >F</text><text x="860.0" y="454.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7A8C" text-anchor="middle" font-weight="400" >functional failure</text><line x1="104.0" y1="96" x2="860.0" y2="96" stroke="#1E74C0" stroke-width="1.5"/><line x1="104.0" y1="91" x2="104.0" y2="101" stroke="#1E74C0" stroke-width="1.5"/><line x1="860.0" y1="91" x2="860.0" y2="101" stroke="#1E74C0" stroke-width="1.5"/><text x="482.0" y="88.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#1E74C0" text-anchor="middle" font-weight="600" >the P–F interval — all the warning physics allows</text><line x1="179.6" y1="389.3" x2="179.6" y2="295.3" stroke="#0B8F86" stroke-width="1" stroke-opacity="0.5"/><circle cx="179.6" cy="389.3" r="7" fill="#0B8F86" stroke="#FFFFFF" stroke-width="2.5"/><text x="185.6" y="285.3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#1C2530" text-anchor="start" font-weight="600" >AI multivariate anomaly detection</text><text x="185.6" y="300.3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7A8C" text-anchor="start" font-weight="400" >weeks to months</text><line x1="330.8" y1="378.6" x2="330.8" y2="326.6" stroke="#0B8F86" stroke-width="1" stroke-opacity="0.5"/><circle cx="330.8" cy="378.6" r="7" fill="#0B8F86" stroke="#FFFFFF" stroke-width="2.5"/><text x="330.8" y="316.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#1C2530" text-anchor="middle" font-weight="600" >Online condition monitoring</text><text x="330.8" y="331.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7A8C" text-anchor="middle" font-weight="400" >weeks</text><line x1="497.1" y1="342.5" x2="497.1" y2="248.5" stroke="#1E74C0" stroke-width="1" stroke-opacity="0.5"/><circle cx="497.1" cy="342.5" r="7" fill="#1E74C0" stroke="#FFFFFF" stroke-width="2.5"/><text x="497.1" y="238.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#1C2530" text-anchor="middle" font-weight="600" >Periodic vibration route</text><text x="497.1" y="253.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7A8C" text-anchor="middle" font-weight="400" >days to weeks, quantised</text><line x1="633.2" y1="287.1" x2="633.2" y2="333.1" stroke="#1E74C0" stroke-width="1" stroke-opacity="0.5"/><circle cx="633.2" cy="287.1" r="7" fill="#1E74C0" stroke="#FFFFFF" stroke-width="2.5"/><text x="633.2" y="349.1" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#1C2530" text-anchor="middle" font-weight="600" >Operator round</text><text x="633.2" y="364.1" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7A8C" text-anchor="middle" font-weight="400" >hours to days</text><line x1="761.7" y1="209.0" x2="761.7" y2="297.0" stroke="#D96A16" stroke-width="1" stroke-opacity="0.5"/><circle cx="761.7" cy="209.0" r="7" fill="#D96A16" stroke="#FFFFFF" stroke-width="2.5"/><text x="761.7" y="313.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#1C2530" text-anchor="middle" font-weight="600" >Fixed DCS alarm</text><text x="761.7" y="328.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7A8C" text-anchor="middle" font-weight="400" >minutes to hours</text><line x1="860.0" y1="130.0" x2="860.0" y2="102.0" stroke="#A8261E" stroke-width="1" stroke-opacity="0.5"/><circle cx="860.0" cy="130.0" r="7" fill="#A8261E" stroke="#FFFFFF" stroke-width="2.5"/><text x="854.0" y="118.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#1C2530" text-anchor="end" font-weight="600" >Protection trip</text><text x="854.0" y="133.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#6B7A8C" text-anchor="end" font-weight="400" >zero — damage limitation</text></svg>